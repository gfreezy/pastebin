name: Build JavaScript Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake python3 pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.target }}
      - name: Build runner
        run: cargo build --release --locked --bin pastebin-js --target ${{ matrix.target }}
      - name: Smoke test packaged executable
        shell: bash
        env:
          RUNNER_BIN: target/${{ matrix.target }}/release/pastebin-js
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          binary = os.environ['RUNNER_BIN']
          p = subprocess.run([binary, 'tests/fixtures/runner.js'], capture_output=True, text=True)
          assert p.returncode == 0, p.stderr
          assert p.stdout == 'runner result', p.stdout
          assert '[log] runner log' in p.stderr, p.stderr
          p = subprocess.run([binary, '--json', '-'], input='export default () => { throw new Error("smoke failure"); }', capture_output=True, text=True)
          assert p.returncode == 1, p.stderr
          assert 'smoke failure' in json.loads(p.stdout)['error'], p.stdout
          PY
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/pastebin-js-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pastebin-js
          cd dist
          shasum -a 256 ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pastebin-js-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: binary-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pastebin-js-*
          path: artifacts
      - name: Verify and collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            artifact="artifacts/pastebin-js-$target"
            (cd "$artifact" && sha256sum --check SHA256SUMS)
            cp "$artifact/pastebin-js-$target.tar.gz" dist/
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
